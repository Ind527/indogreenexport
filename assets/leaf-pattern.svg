<svg width="200" height="200" viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Gradient definitions -->
    <linearGradient id="leafGrad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#C8E6C9;stop-opacity:0.6" />
      <stop offset="50%" style="stop-color:#A5D6A7;stop-opacity:0.4" />
      <stop offset="100%" style="stop-color:#81C784;stop-opacity:0.3" />
    </linearGradient>
    
    <linearGradient id="leafGrad2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#E8F5E8;stop-opacity:0.5" />
      <stop offset="50%" style="stop-color:#C8E6C9;stop-opacity:0.3" />
      <stop offset="100%" style="stop-color:#A5D6A7;stop-opacity:0.2" />
    </linearGradient>
    
    <linearGradient id="leafGrad3" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#4CAF50;stop-opacity:0.3" />
      <stop offset="50%" style="stop-color:#66BB6A;stop-opacity:0.2" />
      <stop offset="100%" style="stop-color:#81C784;stop-opacity:0.1" />
    </linearGradient>
    
    <!-- Pattern definition -->
    <pattern id="leafPattern" x="0" y="0" width="100" height="100" patternUnits="userSpaceOnUse">
      <!-- Small decorative leaves -->
      <g opacity="0.4">
        <!-- Leaf 1 -->
        <path d="M10 40 Q15 20 25 15 Q35 20 40 40 Q35 50 25 45 Q15 50 10 40 Z" 
              fill="url(#leafGrad1)"/>
        <path d="M25 15 L25 45" stroke="#4CAF50" stroke-width="0.5" opacity="0.6"/>
        
        <!-- Leaf 2 -->
        <path d="M60 70 Q65 50 75 45 Q85 50 90 70 Q85 80 75 75 Q65 80 60 70 Z" 
              fill="url(#leafGrad2)"/>
        <path d="M75 45 L75 75" stroke="#66BB6A" stroke-width="0.5" opacity="0.5"/>
        
        <!-- Leaf 3 -->
        <path d="M15 85 Q20 70 28 65 Q36 70 40 85 Q36 92 28 90 Q20 92 15 85 Z" 
              fill="url(#leafGrad3)"/>
        <path d="M28 65 L28 90" stroke="#81C784" stroke-width="0.5" opacity="0.4"/>
        
        <!-- Leaf 4 -->
        <path d="M70 20 Q75 5 83 2 Q91 5 95 20 Q91 28 83 26 Q75 28 70 20 Z" 
              fill="url(#leafGrad1)"/>
        <path d="M83 2 L83 26" stroke="#A5D6A7" stroke-width="0.5" opacity="0.5"/>
      </g>
    </pattern>
  </defs>
  
  <!-- Background pattern -->
  <rect width="200" height="200" fill="url(#leafPattern)"/>
  
  <!-- Large decorative banana leaves -->
  <g opacity="0.2">
    <!-- Large leaf 1 -->
    <path d="M50 150 Q70 80 100 70 Q130 80 150 150 Q130 170 100 165 Q70 170 50 150 Z" 
          fill="url(#leafGrad1)" 
          transform="rotate(-15 100 120)"/>
    <path d="M100 70 L100 165" 
          stroke="#4CAF50" 
          stroke-width="2" 
          opacity="0.4" 
          transform="rotate(-15 100 120)"/>
    
    <!-- Large leaf 2 -->
    <path d="M30 80 Q50 20 80 10 Q110 20 130 80 Q110 100 80 95 Q50 100 30 80 Z" 
          fill="url(#leafGrad2)" 
          transform="rotate(25 80 55)"/>
    <path d="M80 10 L80 95" 
          stroke="#66BB6A" 
          stroke-width="2" 
          opacity="0.3" 
          transform="rotate(25 80 55)"/>
  </g>
  
  <!-- Floating particles -->
  <g opacity="0.3">
    <circle cx="30" cy="30" r="1.5" fill="#4CAF50"/>
    <circle cx="170" cy="50" r="1" fill="#66BB6A"/>
    <circle cx="40" cy="160" r="1.2" fill="#81C784"/>
    <circle cx="160" cy="170" r="0.8" fill="#A5D6A7"/>
    <circle cx="90" cy="20" r="1.1" fill="#4CAF50"/>
    <circle cx="180" cy="120" r="1.3" fill="#66BB6A"/>
    <circle cx="20" cy="120" r="0.9" fill="#81C784"/>
    <circle cx="120" cy="180" r="1.4" fill="#A5D6A7"/>
  </g>
  
  <!-- Decorative dots pattern -->
  <g opacity="0.2">
    <circle cx="45" cy="45" r="0.5" fill="#4CAF50"/>
    <circle cx="155" cy="45" r="0.5" fill="#4CAF50"/>
    <circle cx="45" cy="155" r="0.5" fill="#4CAF50"/>
    <circle cx="155" cy="155" r="0.5" fill="#4CAF50"/>
    <circle cx="100" cy="45" r="0.5" fill="#66BB6A"/>
    <circle cx="45" cy="100" r="0.5" fill="#66BB6A"/>
    <circle cx="155" cy="100" r="0.5" fill="#66BB6A"/>
    <circle cx="100" cy="155" r="0.5" fill="#66BB6A"/>
    <circle cx="100" cy="100" r="0.5" fill="#81C784"/>
  </g>
  
  <!-- Subtle leaf outlines -->
  <g opacity="0.1" fill="none" stroke="#4CAF50" stroke-width="0.5">
    <path d="M180 30 Q185 15 195 10 Q190 25 180 30"/>
    <path d="M20 180 Q25 165 35 160 Q30 175 20 180"/>
    <path d="M180 180 Q185 165 195 160 Q190 175 180 180"/>
    <path d="M20 30 Q25 15 35 10 Q30 25 20 30"/>
  </g>
</svg>
